services:

  # ─── PHP-FPM + Laravel ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: expedientes_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_OPCACHE_ENABLE=0
    networks:
      - juridico_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: expedientes_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - juridico_net
    depends_on:
      - app

  # ─── Vite (assets + HMR) ─────────────────────────────────────────────────────
  vite:
    image: node:20-alpine
    container_name: expedientes_vite
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - juridico_net

  # ─── PostgreSQL 16 + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: expedientes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expedientes_juridicos
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - juridico_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d expedientes_juridicos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI — Servicio IA ───────────────────────────────────────────────────
  ai:
    build:
      context: ../expedientes-ai
      dockerfile: Dockerfile
    container_name: expedientes_ai
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://laravel:secret@postgres:5432/expedientes_juridicos
      STORAGE_PATH: /storage/documentos
    volumes:
      # Comparte el storage de Laravel para leer los archivos subidos
      - ./storage/app/documentos:/storage/documentos:ro
      # Hot reload del código Python en desarrollo
      - ../expedientes-ai/app:/app/app
    ports:
      - "8001:8000"
    networks:
      - juridico_net
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Queue Worker (Laravel) ───────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: expedientes_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    networks:
      - juridico_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_started

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: expedientes_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - juridico_net

networks:
  juridico_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
